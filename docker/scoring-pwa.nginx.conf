# nginx config for the scoring-pwa container.
#
# The PWA is a single-page app built by Vite — every non-asset path falls back
# to /index.html so client-side routing works. Static assets get long cache
# headers because Vite fingerprints them; index.html is no-cache so updates
# propagate immediately.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Vite builds fingerprinted asset names — safe to cache hard.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # The PWA service worker must never be cached or installs get stuck.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # gzip for text payloads
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Trim noisy logs in dev
    error_log /var/log/nginx/error.log warn;
}
