# open-cricket-stream — DHCP + DNS for the AP
#
# Pi acts as 10.42.0.1. Phone and scorer pick up addresses 10.42.0.10..50.
# DNS forwards to a public resolver — necessary for the PWA to fetch its
# Supabase project, but not load-bearing during a match.

interface=wlan0
bind-interfaces

dhcp-range=10.42.0.10,10.42.0.50,12h
dhcp-option=3,10.42.0.1     # default gateway
dhcp-option=6,10.42.0.1     # DNS

# Map score.ocs.local → the Pi so the scorer doesn't need to remember an IP.
address=/score.ocs.local/10.42.0.1
address=/rig.ocs.local/10.42.0.1

# Upstream DNS — Cloudflare + Google as fallback.
server=1.1.1.1
server=8.8.8.8
