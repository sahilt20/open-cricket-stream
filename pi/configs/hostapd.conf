# open-cricket-stream — Wi-Fi access point on the Pi
#
# Phone (camera) and scorer's device both connect to this AP. The Pi is the
# only thing that needs to reach the internet (for the YouTube push), via 4G
# uplink on a different interface.
#
# IMPORTANT: change ssid + wpa_passphrase before deploying to a real club.

interface=wlan0
driver=nl80211

ssid=OCS-Rig
hw_mode=g
channel=6
country_code=GB
ieee80211d=1

wpa=2
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP
wpa_passphrase=cricket-is-the-best

auth_algs=1
ignore_broadcast_ssid=0

# Encourage clients to roam off — keeps the AP responsive when the scorer
# walks 30m to the boundary.
disassoc_low_ack=1
