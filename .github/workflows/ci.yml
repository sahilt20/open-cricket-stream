name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:

  # ── Host-mode: typecheck, build all workspaces, run tests ──────────────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build @ocs/db (engine and PWA depend on its dist output)
        run: npm run build --workspace=@ocs/db

      - name: Typecheck all workspaces
        run: npm run typecheck --workspaces --if-present

      - name: Build all workspaces
        run: npm run build --workspaces --if-present

      - name: Run tests
        run: npm test --workspaces --if-present

  # ── Lint shell scripts (pi/setup.sh, pi/setup-ap.sh, etc.) ────────────────
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./pi
          severity: warning

  # ── Validate compose file ──────────────────────────────────────────────────
  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  # ── Build docker images for both architectures ─────────────────────────────
  # On PRs: build only (no push), one platform, to keep things fast.
  # On main and tags: build + push multi-arch images to ghcr.io.
  docker-images:
    needs: [build-and-test, shellcheck, compose-validate]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [engine, pwa]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/open-cricket-stream-${{ matrix.target }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          # PRs: amd64 only (faster); main + tags: multi-arch for the Pi.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
